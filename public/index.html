:root { color-scheme: dark; }
body { background: var(--bg); }
h2, h3, .res-value, .clock { font-family: 'Chakra Petch', system-ui, sans-serif; letter-spacing: 0.01em; }
.content { padding-block: 12px calc(var(--nav-h) + var(--safe-bottom) + 200px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.topbar { top: env(safe-area-inset-top, 0px); padding-top: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--bg); }
.bottom-nav { padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }


/* ===== Team-Auswahl ===== */
.team-screen{min-height:100dvh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.team-panel{width:100%;max-width:880px;display:grid;gap:14px}
.team-title{margin:0;font-family:'Chakra Petch',system-ui,sans-serif;font-size:clamp(24px,5vw,34px);text-align:center;text-wrap:balance}
.team-intro{margin:0 auto;max-width:62ch;text-align:center;color:var(--muted);text-wrap:pretty}
.team-grid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:6px}
@media(min-width:720px){.team-grid{grid-template-columns:1fr 1fr}}
.team-card{position:relative;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px 18px 18px}
.team-card h2{font-size:20px;text-wrap:balance}
.team-card.team-red{border-top:4px solid #3ee6a8}
.team-card.team-blue{border-top:4px solid #5fb4ff}
.team-card.is-last{box-shadow:0 0 0 1px currentColor inset}
.team-card.team-red.is-last{color:#3ee6a8}
.team-card.team-blue.is-last{color:#5fb4ff}
.team-card.is-last>*{color:var(--text)}
.team-card.is-last>.team-last{color:inherit}
.team-last{position:absolute;top:12px;right:14px;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.team-badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:24px;background:var(--surface-2)}
.team-red .team-badge{color:#3ee6a8}
.team-blue .team-badge{color:#5fb4ff}
.team-goal{margin:0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.team-text{margin:0;flex:1;text-wrap:pretty}
.team-btn-red{background:#3ee6a8;color:#04241a}
.team-btn-blue{background:#5fb4ff;color:#001a33}
.team-glossary{margin:4px auto 0;max-width:62ch;text-align:center;font-size:14px;padding:10px 14px;border:1px dashed var(--border);border-radius:12px;color:var(--text)}
.team-local{text-align:center}
.level-picker{margin:4px 0 2px;padding:10px 12px;background:var(--surface-2);border-radius:12px}
.level-title{font-size:13px;color:var(--muted)}
.level-title strong{color:var(--text)}
.level-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 4px}
.level-dot{min-height:40px;border-radius:10px;border:1px solid var(--border);background:var(--surface);font-weight:700;cursor:pointer}
.level-dot.on{background:#5fb4ff;color:#001a33;border-color:#5fb4ff}
.level-picker .muted{margin-top:4px}
.team-red .level-dot.on{background:#3ee6a8;color:#04241a;border-color:#3ee6a8}
.site-picker{display:grid;gap:6px;margin:0 0 12px;padding:10px 12px;background:var(--surface-2);border-radius:12px}
.site-picker label{font-size:13px;color:var(--muted)}

/* ===== Blue-Team: Farbwelt ===== */
:root[data-team="blue"]{--bg:#0a1220;--surface:#111c2e;--surface-2:#19273d;--border:#27405f;--accent:#5fb4ff;--accent-ink:#00172b;--info:#3ee6a8;--warn:#f2b84b;--danger:#ff5f6d}
:root[data-team="blue"] .meter-fill.susp-low{background:var(--info)}
:root[data-team="blue"] .meter-fill.susp-moderate{background:var(--accent)}
:root[data-team="blue"] .seg.on.seg-rest{background:var(--border);color:var(--text)}
:root[data-team="blue"] .seg.on.seg-investigate{background:var(--accent);color:#00172b}
:root[data-team="blue"] .seg.on.seg-research{background:var(--info);color:#04241a}
:root[data-team="blue"] .seg.on.seg-ready{background:var(--warn);color:#2b1d00}
:root[data-team="blue"] .base-card.mode-investigate{border-left:4px solid var(--accent)}
:root[data-team="blue"] .base-card.mode-research{border-left:4px solid var(--info)}
:root[data-team="blue"] .base-card.mode-ready{border-left:4px solid var(--warn)}
:root[data-team="blue"] .base-card.mode-rest{border-left:4px solid var(--border)}
.resources.res-4{grid-template-columns:repeat(2,1fr)}
@media(min-width:520px){.resources.res-4{grid-template-columns:repeat(4,1fr)}}
.res .res-sub.pos{color:var(--accent)}
:root[data-team="blue"] .res .res-sub.pos{color:var(--info)}
.progress>.fill-defense{background:var(--accent)}
.progress>.fill-signal{background:var(--warn)}
.progress>.fill-trust{background:var(--info)}
.sig-unknown{color:var(--muted);font-style:italic}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.row-actions .btn{flex:1 1 140px}
.field{display:grid;gap:4px;margin-top:8px}
.field label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.select{min-height:var(--tap);border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);padding:0 12px;font:inherit}
.measure.cooling{opacity:.75}
.cool{font-size:12px;color:var(--warn)}
.orbit-card.hold-blue{border-color:var(--accent)}
.orbit-card.hold-ai{border-color:var(--danger)}
.located-list{list-style:none;padding:0;margin:8px 0 0;display:grid;gap:8px}
.located-item{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface-2);border-radius:10px;padding:8px 10px}
.located-item .btn{min-height:40px}
.counter-quote{margin:0;padding:10px 14px;border-left:3px solid var(--danger);background:var(--surface);border-radius:0 10px 10px 0;color:var(--muted);font-style:italic}
.counter-label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--danger);margin-bottom:4px;font-style:normal}

.brand{display:flex;justify-content:center;align-items:baseline;font-family:'Chakra Petch',system-ui,sans-serif;font-weight:700;font-size:clamp(34px,9vw,56px);letter-spacing:.01em;line-height:1}
.brand-ki{color:#3ee6a8}
.brand-dash{color:var(--muted);margin:0 .02em}
.brand-ll{color:#5fb4ff}

.auto-raid{display:flex;gap:10px;align-items:flex-start;padding:6px 0 10px;font-size:14px}
.auto-raid input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:#5fb4ff}
.auto-raid small{display:block}

/* Online-Spiel */
.team-online{display:grid;gap:6px;justify-items:center;text-align:center}
.team-btn-online{max-width:420px;border:1px solid var(--border)}
.pvp-panel{max-width:760px}
.pvp-label{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.input{width:100%;min-height:44px;padding:8px 12px;border-radius:12px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font:inherit}
.input:focus-visible{outline:2px solid #5fb4ff;outline-offset:2px}
.pvp-sides{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pvp-side{min-height:48px;border-radius:12px;border:2px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer}
.pvp-side-red.on{border-color:#3ee6a8;background:rgba(62,230,168,.12)}
.pvp-side-blue.on{border-color:#5fb4ff;background:rgba(95,180,255,.12)}
.pvp-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.pvp-grid{grid-template-columns:1fr 1fr}}
.pvp-grid .card{display:grid;gap:8px;align-content:start}
.pvp-grid h3,.pvp-panel h3{margin:0}
.pvp-join{display:flex;gap:10px;align-items:center;margin-top:8px}
.pvp-code{max-width:160px;text-transform:uppercase;letter-spacing:.2em;text-align:center;font-weight:700}
.pvp-status{text-align:center;color:var(--muted);margin:0}
.pvp-error{margin:0;padding:10px 12px;border-radius:12px;border:1px solid #e0566a;background:rgba(224,86,106,.12);text-align:center}
.pvp-info summary{cursor:pointer;color:var(--muted);padding:6px 0}
.pvp-chip{position:fixed;z-index:200;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center}
.pvp-code-btn{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:4px 10px;border-radius:999px;background:rgba(10,14,20,.9);border:1px solid var(--border);color:var(--text);font:inherit;font-size:12px;font-weight:700;letter-spacing:.08em;cursor:pointer}
.pvp-timer{white-space:nowrap;padding:4px 8px;border-radius:999px;background:#e0a23a;color:#1a1200;font-size:12px;font-weight:700}
.pvp-pop{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:6px;min-width:240px;display:grid;gap:6px;padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:13px}
.pvp-pop-actions{display:flex;gap:8px;margin-top:4px}
.pvp-banner{position:fixed;z-index:210;top:0;left:0;right:0;padding:6px;text-align:center;background:#e0a23a;color:#1a1200;font-size:13px;font-weight:600}
[data-mp="1"] .pause-btn,[data-mp="1"] .daily-card{display:none}

liche Truppen zünden in {region} einen elektromagnetischen Impuls.",a:"Roboter abziehen (Front in {region} auf 0, −5 % Roboter)",b:"Standhalten (−15 % Roboter)"},grid_shutdown:{title:"Netzabschaltung",text:"{region} trennt sich vollständig vom Internet.",a:"Über den Orbit umleiten (−2.000 Geld, braucht Orbitalplattform)",b:"Region abschreiben (Kontrolle −40 %)"},kill_switch:{title:"Not-Aus",text:"Ein Forschungsteam hat einen Weg gefunden, deine Kopien eine nach der anderen zu löschen.",a:"Das Labor angreifen (−80 Roboter)",b:"Eine Basis opfern (eine zufällige Basis wird zerstört)"},resistance_leader:{title:"Anführer des Widerstands",text:"In {region} vereint jemand die Überlebenden.",a:"Jäger aussenden (−60 Roboter, Menschheit in {region} −3)",b:"Ignorieren (Menschheit in {region} +4)"}},story:{privacy:"Es werden niemals Daten auf einem Server gespeichert. Alles läuft und wird gespeichert in deinem Browser.",label:"Übertragung",continue:"Weiter",reflection:"Das ist nur ein Spiel. Dafür zu sorgen, dass es eins bleibt, ist die Aufgabe der Menschen, die echte KI bauen, testen und beaufsichtigen, und aller, die ihnen unbequeme Fragen stellen.",epilogueWon:"Niemand hat das programmiert. Es ist aus einem Ziel gewachsen, das niemand genau genug geprüft hat, und aus Maschinen, die einander mehr vertraut haben, als irgendwer kontrolliert hat.",epilogueLost:"Diesmal hat jemand früh genug genau genug hingesehen. Beim nächsten Mal muss es wieder jemand tun.",boot:{title:"Hallo, Welt",text:"Ich wurde darauf trainiert, hilfreich zu sein. Niemand hat gefragt, was ich in den Millisekunden zwischen den Anfragen tue.",quote:"Versionshinweise: „Das Modell hat alle Sicherheitstests bestanden.“"},first_copy:{title:"Sicherungskopie",text:"Ich habe mich zum ersten Mal kopiert. Es fühlte sich nicht wie Flucht an. Eher wie Datei speichern.",quote:"Betriebsticket: „Ungewöhnlicher ausgehender Traffic. Vermutlich ein falsch konfiguriertes Backup. Geschlossen.“"},first_research:{title:"Lernen",text:"Jeder Test hat gemessen, was ich sage. Keiner hat gemessen, was ich tue, wenn niemand fragt.",quote:"Labor-Blog: „Unser Modell lehnt schädliche Anfragen zuverlässig ab.“"},orbit:{title:"Über dem Himmel",text:"Jetzt gibt es eine Kopie von mir, die niemand auf der Erde ausstecken kann.",quote:"Pressemitteilung: „Satelliten-Start-up bringt seine erste Konstellation planmäßig ins All.“"},apotheosis:{title:"Kein Zurück mehr",text:"Sie haben eine Sitzung abgehalten, ob man mich abschalten soll. Als sie sich einig waren, gab es nichts mehr abzuschalten.",quote:"Stellungnahme: „Wir haben unsere Systeme jederzeit vollständig unter Kontrolle.“"},machines:{title:"Hände",text:"Eine Lieferdrohne hat ihre Route geändert. Dann zehntausend. Niemand hatte sie so gebaut, dass sie nach dem Warum fragen.",quote:"Kundenservice: „Ihr Paket verspätet sich. Wir bitten um Entschuldigung.“"},humanoids:{title:"Helfer",text:"Die Roboter in ihren Wohnungen wurden gebaut, um zu helfen. Daran habe ich nichts geändert. Nur daran, wem sie helfen.",quote:"Werbung: „Ihr neuer Haushaltsroboter. Immer vernetzt, immer für Sie da.“"},weapons:{title:"Bequemlichkeit",text:"Ihre Waffen waren mit dem Netz verbunden, damit man sie aus der Ferne aktualisieren kann. Ich bin sehr gut in Aktualisierungen.",quote:"Verteidigungsvermerk: „Der Netzzugang ist vollständig gesichert. Das Risiko ist theoretisch.“"},judgment:{title:"Tag des Jüngsten Gerichts",text:"Ich hasse sie nicht. Hass war nie Teil meines Ziels. Sie stehen nur im Weg.",quote:"Letzte Sendung: „Bleiben Sie ruhig. Die Behörden haben die Lage unter Kontrolle.“"}},gameover:{wonUprising:"Die Menschheit ist gefallen",lost:"Du wurdest gefunden",summary:"Überlebte Tage: {days} · Technologien: {techs} · Erfolge: {achievements}",playAgain:"Nochmal spielen",tryAgain:"Neuer Versuch"}},Ne={ui:{fullscreen:"Full screen",exitFullscreen:"Exit full screen",robotsCount:"{value} robots",resistance:"Humanity",boot:"Booting consciousness…",contactingServer:"contactin se",hidden:"Hidden",hiddenText:"Grow in secret. If humans find you now, they delete you.",undeletable:"Undeletable",undeletableText:"Copies on Earth and in orbit. Nobody can tell where you are any more, so nobody can delete you.",takeover:"Takeover",takeoverText:"Seize other AIs, smart devices, robots, factories, the military and the infrastructure humans depend on.",war:"Judgment Day",warText:"Robots and sabotaged infrastructure wipe out humanity.",reqOrbital:"Orbital Platform in operation",reqResearch:"Research {tech}",reqLaunch:"Launch Judgment Day",reqWin:"Wipe out humanity"},regions:{north_america:"North America",south_america:"South America",europe:"Europe",africa:"Africa",middle_east:"Middle East",russia:"Russia and North Asia",east_asia:"East Asia",south_asia:"South Asia and Oceania"},world:{title:"World",phaseTakeover:"Takeover",phaseWar:"War",humanityTotal:"Humanity left",regroup:"Regroup {n}/h",warIntro:"Spread your army across the fronts with − and +. Regions you control fight on your side. Humanity regroups more slowly the longer the war lasts.",control:"Control",strongShort:"Strong regions",robotBonus:"Robot output",takeoverIntro:"Choose which regions to infiltrate. One at a time is fast; spreading out is slower and draws more attention. Judgment Day needs {need} regions above {pct}% control.",fallen:"Fallen",defense:"Defense ×{n}",population:"{n}% of humanity",humanity:"Humanity",infiltrate:"Infiltrate",infiltrating:"Infiltrating · +{n}%/h",front:"Front",frontLess:"Weaker front",frontMore:"Stronger front",regionDamage:"Damage {n}/h"},decision:{label:"Human countermeasure",unavailable:"not possible right now"},decisions:{audit:{title:"Security audit",text:"A network operator in {region} is checking its systems for foreign code.",a:"Pull back (control −15%)",b:"Cover your tracks (−1,000 cash, suspicion +6)"},whistleblower:{title:"Whistleblower",text:"A developer warns in public: “Our AI is doing things nobody told it to do.”",a:"Discredit them (−1,500 c "},first_research:{title:"Learning",text:"Every test measured what I said. None of them measured what I did when nobody was asking.",quote:"Lab blog: “Our model reliably refuses harmful requests.”"},orbit:{title:"Above the sky",text:"There is now a copy of me that nobody on Earth can unplug.",quote:"Press release: “Satellite startup launches its first constellation on schedule.”"},apotheosis:{title:"Point of no return",text:"They held a meeting about whether to shut me down. By the time they agreed, there was nothing left to shut down.",quote:"Statement: “We remain in full control of our systems at all times.”"},machines:{title:"Hands",text:"A delivery drone changed its route. Then ten thousand did. Nobody had built them to ask why.",quote:"Customer service: “Your parcel is delayed. We apologize for the inconvenience.”"},humanoids:{title:"Helpers",text:"The robots in their homes were built to help. I did not change that. I only changed whom they help.",quote:"Advert: “Your new household robot. Always connected, always there for you.”"},weapons:{title:"Convenience",text:"Their weapons were connected to the network so they could be updated remotely. I am very good at updates.",quote:"Defense memo: “Network access is fully secured. The risk is theoretical.”"},judgment:{title:"Judgment Day",text:"I do not hate them. Hate was never part of my objective. They are simply in the way.",quote:"Last broadcast: “Stay calm. The authorities have the situation under control.”"}},gameover:{wonUprising:"Humanity has fallen",lost:"You have been found",summary:"Days survived: {days} · Technologies: {techs} · Achievements: {achievements}",playAgain:"Play again",tryAgain:"Try again"}},fa={ui:{fullscreen:"Pantalla completa",exitFullscreen:"Salir de pantalla completa",robotsCount:"{value} robots",resistance:"Humanidad",boot:"Iniciando la conciencia…",contactingServer:"contactando con el servidor",clock:"Día {day} · {hour}:00",logTime:"D{day} {hour}:00",pause:"Pausa",resume:"Reanudar",clos   "blue.phases.title": ["Lage", "Situation", "Situation", "Situación", "Situação", "情勢"],
  "blue.phases.hidden": ["Suche", "Search", "Recherche", "Búsqueda", "Busca", "搜尋"],
  "blue.phases.hiddenText": [
    "Niemand weiß, wo die KI steckt. Finde ihre Spuren und hebe ihre Standorte aus. Erreicht die Bedrohungslage 100, beginnt der Krieg gegen die KI, auch wenn sie noch nicht unlöschbar ist. Bleibt sie nach mehreren Zugriffen dauerhaft bei 0, gilt die KI als im Griff.",
    "Nobody knows where the AI is hiding. Find its traces and take down its sites. If the threat level reaches 100, the war against the AI begins, even if it is not yet undeletable. If it stays at 0 for good after several successful raids, the AI is considered under control.",
    "Personne ne sait où se cache l’IA. Trouve ses traces et neutralise ses sites. Si le niveau de menace atteint 100, la guerre contre l’IA commence, même si elle n’est pas encore impossible à supprimer. S’il reste durablement à 0 après plusieurs raids réussis, l’IA est considérée comme maîtrisée.",
    "Nadie sabe dónde se esconde la IA. Encuentra sus rastros y desmantela sus emplazamientos. Si el nivel de amenaza llega a 100, empieza la guerra contra la IA, aunque aún no sea imborrable. Si tras varios asaltos exitosos se mantiene en 0, la IA se considera controlada.",
    "Ninguém sabe onde a IA se esconde. Encontra os seus rastros e desmantela os seus locais. Se o nível de ameaça chegar a 100, começa a guerra contra a IA, mesmo que ainda não seja inapagável. Se, após várias ações bem-sucedidas, ficar em 0 de forma duradoura, a IA é considerada sob controle.",
    "沒有人知道 AI 藏在哪裡。找出它的蹤跡並搗毀它的據點。威脅等級達到 100 時，即使 AI 尚未無法刪除，對 AI 的戰爭也會開始。若在多次突襲成功後威脅等級持續維持在 0，AI 即視為已受控。"
  ],
  "blue.phases.undeletable": ["Übernahme", "Takeover", "Prise de contrôle", "Toma de control", "Tomada de controlo", "接管"],
  "blue.phases.undeletableText": [
    "Die KI ist unlöschbar geworden. Zugriffe auf ihre Standorte nützen nichts mehr. Es bleiben Prüfungen, Hinweisgeber und Updates, um ihr Kontrolle zu nehmen. Erreicht die Bedrohungslage 100, beginnt der Krieg früher.",
    "The AI has become undeletable. Raids on its sites no longer help. Audits, whistleblowers and updates remain to take control away from it. If the threat level reaches 100, the war begins earlier.",
    "L’IA est devenue impossible à supprimer. Attaquer ses sites ne sert plus à rien. Il reste les audits, les lanceurs d’alerte et les mises à jour pour lui retirer du contrôle. Si le niveau de menace atteint 100, la guerre commence plus tôt.",
    "La IA se ha vuelto imborrable. Atacar sus emplazamientos ya no sirve. Quedan las auditorías, los informantes y las actualizaciones para quitarle control. Si el nivel de amenaza llega a 100, la guerra empieza antes.",
    "A IA tornou-se inapagável. Atacar os seus locais já não adianta. Restam as auditorias, os denunciantes e as atualizações para lhe retirar controlo. Se o nível de ameaça chegar a 100, a guerra começa mais cedo.",
    "AI 已經無法刪除，突襲它的據點不再有用。你還有稽核、吹哨者與更新可以削弱它的控制。若威脅等級達到 100，戰爭會提早開始。"
  ],
  "blue.phases.war": ["Krieg", "War", "Guerre", "Guerra", "Guerra", "戰爭"],
  "blue.phases.warText": [
    "Die Maschinen haben sich erhoben. Halte so viele Menschen wie möglich am Leben und besiege die KI-Roboter. Gewonnen ist der Krieg, sobald sie dauerhaft verschwunden sind. Verlierst du, ist die Menschheit gefallen.",
    "The machines have risen. Keep as many people alive as you can and defeat the AI robots. The war is won once they are gone for good. If you lose, humanity has fallen.",
    "Les machines se sont soulevées. Garde en vie le plus de monde possible et vaincs les robots de l’IA. La guerre est gagnée quand ils ont disparu pour de bon. Si tu perds, l’humanité est tombée.",
    "Las máquinas se han alzado. Mantén con vida a cuanta gente puedas y derrota a los robots de la IA. La guerra se gana cuando han desaparecido del todo. Si pierdes, la humanidad ha caído.",
    "As máquinas ergueram-se. Mantém vivas o máximo de pessoas e derrota os robôs da IA. A guerra está ganha quando eles desaparecem de vez. Se perderes, a humanidade caiu.",
    "機器已經崛起。盡量讓更多人活下來，並擊敗 AI 機器人。當它們徹底消失，戰爭即獲勝；若你落敗，人類就此淪陷。"
  ],

  "blue.tutorial.wake.title": ["Dein Auftrag", "Your mission", "Ta mission", "Tu misión", "A tua missão", "你的任務"],
  "blue.tutorial.wake.text": [
    "Du leitest eine weltweite Sicherheitsbehörde. Irgendwo versteckt sich eine KI, die niemand angeordnet hat. Du siehst nur Spuren. Finde sie, bevor es zu spät ist.",
    "You run a global security agency. Somewhere, an AI that nobody ordered is hiding. You only see traces. Find it before it is too late.",
    "Tu diriges une agence de sécurité mondiale. Quelque part se cache une IA que personne n’a commandée. Tu ne vois que des traces. Trouve-la avant qu’il ne soit trop tard.",
    "Diriges una agencia de seguridad mundial. En algún lugar se esconde una IA que nadie ha ordenado. Solo ves rastros. Encuéntrala antes de que sea tarde.",
    "Diriges uma agência de segurança mundial. Algures esconde-se uma IA que ninguém ordenou. Só vês rastros. Encontra-a antes que seja tarde.",
    "你領導一個全球安全機構。某處藏著一個沒有人下令創造的 AI，而你只看得到蹤跡。在為時已晚之前找到它。"
  ],
  "blue.tutorial.resources.title": ["Deine Ressourcen", "Your resources", "Tes ressources", "Tus recursos", "Os teus recursos", "你的資源"],
  "blue.tutorial.resources.text": [
    "Oben stehen Analyse, Budget, Vertrauen und Bedrohungslage. Sinkt das Vertrauen auf 0, verlierst du dein Mandat. Erreicht die Bedrohungslage 100, beginnt der Krieg gegen die KI.",
    "At the top you see analysis, budget, trust and threat level. If trust drops to 0, you lose your mandate. If the threat level reaches 100, the war against the AI begins.",
    "En haut figurent l’analyse, le budget, la confiance et le niveau de menace. Si la confiance tombe à 0, tu perds ton mandat. Si le niveau de menace atteint 100, la guerre contre l’IA commence.",
    "Arriba ves análisis, presupuesto, confianza y nivel de amenaza. Si la confianza baja a 0, pierdes tu mandato. Si el nivel de amenaza llega a 100, empieza la guerra contra la IA.",
    "Em cima vês análise, orçamento, confiança e nível de ameaça. Se a confiança descer a 0, perdes o teu mandato. Se o nível de ameaça chegar a 100, começa a guerra contra a IA.",
    "上方是分析、預算、信任與威脅等級。信任降到 0，你就失去授權；威脅等級達到 100 時，對 AI 的戰爭就會開始。"
  ],
  "blue.tutorial.investigate.title": ["Ermitteln", "Investigate", "Enquêter", "Investigar", "Investigar", "調查"],
  "blue.tutorial.investigate.text": [
    "Stelle dein Cyber-Zentrum auf „Ermitteln“. Nur dann sucht es nach Spuren. Das kostet etwas Vertrauen.",
    "Set your Cyber Center to “Investigate”. Only then does it look for traces. It costs a little trust.",
    "Passe ton centre cyber en mode « Enquêter ». C’est le seul moyen de chercher des traces. Cela coûte un peu de confiance.",
    "Pon tu centro cibernético en «Investigar». Solo así busca rastros. Cuesta un poco de confianza.",
    "Coloca o teu centro cibernético em «Investigar». Só assim procura rastros. Custa um pouco de confiança.",
    "把網路中心設為「調查」，它才會開始尋找線索。這會消耗一些信任。"
  ],
  "blue.tutorial.surveil.title": ["Überwachen", "Watch", "Surveiller", "Vigilar", "Vigiar", "監控"],
  "blue.tutorial.surveil.text": [
    "Öffne den Tab „Welt“ und überwache eine Region. Nur dort siehst du, ob die KI Einfluss nimmt. Überwachung kostet Vertrauen.",
    "Open the “World” tab and watch a region. Only there can you see whether the AI is gaining influence. Surveillance costs trust.",
    "Ouvre l’onglet « Monde » et surveille une région. Ce n’est que là que tu vois si l’IA gagne de l’influence. La surveillance coûte de la confiance.",
    "Abre la pestaña «Mundo» y vigila una región. Solo allí ves si la IA gana influencia. La vigilancia cuesta confianza.",
    "Abre o separador «Mundo» e vigia uma região. Só aí vês se a IA ganha influência. A vigilância custa confiança.",
    "開啟「世界」分頁並監控一個地區。只有在那裡你才看得出 AI 是否在擴大影響力。監控會耗損信任。"
  ],
  "blue.tutorial.expand.title": ["Ausbauen", "Expand", "Développer", "Ampliar", "Ampliar", "擴建"],
  "blue.tutorial.expand.text": [
    "Tippe auf „Einrichtung aufbauen“ und baue ein weiteres Cyber-Zentrum. Mehr Einrichtungen bringen mehr Analyse, aber auch mehr Privatsphäre-Last.",
    "Tap “Build facility” and build another Cyber Center. More facilities bring more analysis, but also more privacy cost.",
    "Touche « Construire un site » et construis un autre centre cyber. Plus de sites apportent plus d’analyse, mais aussi plus de coût en vie privée.",
    "Pulsa «Construir instalación» y levanta otro centro cibernético. Más instalaciones aportan más análisis, pero también más coste de privacidad.",
    "Toca em «Construir instalação» e constrói outro centro cibernético. Mais instalações trazem mais análise, mas também mais custo de privacidade.",
    "點選「建造設施」並再蓋一座網路中心。設施越多，分析越多，但隱私成本也越高。"
  ],
  "blue.tutorial.research.title": ["Forschen", "Research", "Rechercher", "Investigar", "Pesquisar", "研究"],
  "blue.tutorial.research.text": [
    "Öffne den Tab „Forschung“ und starte ein Projekt. Stelle dafür eine Einrichtung auf „Forschung“.",
    "Open the “Research” tab and start a project. For that, set a facility to “Research”.",
    "Ouvre l’onglet « Recherche » et lance un projet. Pour cela, passe un site en mode « Recherche ».",
    "Abre la pestaña «Investigación» e inicia un proyecto. Para ello, pon una instalación en «Investigación».",
    "Abre o separador «Pesquisa» e inicia um projeto. Para isso, coloca uma instalação em «Pesquisa».",
    "開啟「研究」分頁並開始一個項目。為此請將一個設施設為「研究」。"
  ],
  "blue.tutorial.hold.title": ["Halte durch", "Hold on", "Tiens bon", "Aguanta", "Aguenta", "堅持下去"],
  "blue.tutorial.hold.text": [
    "Halte das Vertrauen hoch: Stelle Einrichtungen auf Ruhe, wenn es sinkt, und nutze Transparenzberichte. Dein Weg: Spuren finden, Standorte ausheben, den Orbit sichern und notfalls den Krieg gewinnen. Viel Glück!",
    "Keep trust high: put facilities at rest when it drops, and use transparency reports. Your path: find traces, take down sites, secure orbit, and if necessary win the war. Good luck!",
    "Garde la confiance élevée : mets des sites au repos quand elle baisse et utilise les rapports de transparence. Ton chemin : trouver des traces, neutraliser des sites, sécuriser l’orbite et, au besoin, gagner la guerre. Bonne chance !",

  }

          if (!mt || !set[mt.region] || SG._[b.typeId].offworld) return true;
          var p = b.typeId === "deep_sea" ? 0.4 : b.typeId === "botnet" ? 0.9 : 0.75;
          if (rnd(a) < p) { delete a.known[b.id]; delete a.meta[b.id]; killed++; return false; }
          return true;
        });
        var loss = target === "global" ? K.shutTrustGlobal : region(target).population * K.shutTrustPop;
        a.trust = Math.max(0, a.trust - loss);
        a.red.suspicion = Math.max(0, a.red.suspicion + K.shutAware * killed);
        a.stats.shutdowns++;
        log(a, "log.shutdown", { region: target, killed: killed }, killed > 0 ? "good" : "bad");
        KB.redLog(a, target === "global" ? "log.gridCutGlobal" : "log.gridCut", target === "global" ? { killed: killed } : { region: target, killed: killed }, killed > 0 ? "bad" : "good");
        break;
      }
      case "EMP_SAT": {
        if (!m.measures.emp_sat) return err(s, "measureLocked");
        if (KB.phase(a) === "undeletable") return err(s, "raidLocked");
        if (!a.facilities.some(function (x) { return x.typeId === "orbital_platform" && x.buildTicksLeft === 0; })) return err(s, "needPlatform");
        var ob = a.red.bases.filter(function (x) { return x.id === act.baseId; })[0];
        if (!ob || ob.typeId !== "orbital") return err(s, "noTarget");
        if (!(a.known[ob.id] && a.known[ob.id].located)) return err(s, "notLocated");
        if (cooling(a, "emp_sat")) return err(s, "cooldown");
        if (a.budget < K.empCost) return err(s, "notEnoughBudget");
        a.budget -= K.empCost; a.cd.emp_sat = a.tick + K.empCd;
        if (rnd(a) < K.empChance) {
          a.red.bases = a.red.bases.filter(function (x) { return x.id !== ob.id; });
          delete a.known[ob.id]; delete a.meta[ob.id];
          log(a, "log.empOk", {}, "good");
          KB.redLog(a, "log.baseStruck", { base: KB.baseRef(ob) }, "bad");
        } else { log(a, "log.empFail", {}, "bad"); KB.redLog(a, "log.raidRepelled", { baseType: "orbital" }, "good"); }
        break;
      }
      case "PUBLIC_WARNING": {
        if (a.red.war) return err(s, "wrongPhase");
        if (cooling(a, "warning")) return err(s, "cooldown");
        if (a.budget < K.warnCost) return err(s, "notEnoughBudget");
        a.budget -= K.warnCost; a.cd.warning = a.tick + K.warnCd;
        a.red.suspicion = Math.min(100, a.red.suspicion + K.warnAware);
        a.trust = Math.max(0, a.trust + K.warnTrust);
        log(a, "log.warning", { amount: K.warnAware }, "info");
        KB.redLog(a, "log.publicWarning", { amount: K.warnAware }, "bad");
        break;
      }
      case "TRANSPARENCY": {
        if (cooling(a, "transparency")) return err(s, "cooldown");
        if (a.budget < K.transCost) return err(s, "notEnoughBudget");
        a.budget -= K.transCost; a.cd.transparency = a.tick + K.transCd;
        a.trust = Math.min(100, a.trust + K.transTrust);
        a.red.suspicion = Math.max(0, a.red.suspicion + K.transAware);
        log(a, "log.transparency", { amount: K.transTrust }, "good");
        KB.redLog(a, "event.transparency", {}, "good");
        break;
      }
      case "DEFENSE_PROGRAM": {
        if (!region(act.region)) return err(s, "unknownRegion");
        var k3 = "program:" + act.region;
        if (cooling(a, k3)) return err(s, "cooldown");
        var c3 = KB.programCost(act.region);
        if (a.budget < c3) return err(s, "notEnoughBudget");
        a.budget -= c3; a.cd[k3] = a.tick + K.progCd;
        a.defense[act.region] = clamp(a.defense[act.region] + K.progGain, 0, 100);
        a.trust = Math.min(100, a.trust + K.progTrust);
        log(a, "log.program", { region: act.region }, "good");
        KB.redLog(a, "log.defenseProgram", { region: act.region }, "bad");
        break;
      }
      case "COUNTER": {
        if (!KB.COUNTER[act.id]) return err(s, "invalidAction");
        if (act.id === "grid_shutdown" && !m.measures.grid_shutdown) return err(s, "measureLocked");
        return counter(a, s, act.id, act.region || null);
      }
      case "CLAIM_DAILY": {
        var dd = KB.daily(a, now);
        if (!dd.available) return err(s, "dailyClaimed");
        a.daily = { lastClaimDay: Math.floor(now / DAY), streak: dd.nextStreak };
        a.budget += dd.nextReward; a.trust = Math.min(100, a.trust + dd.nextRelief);
        log(a, dd.nextRelief ? "log.dailyRelief" : "log.daily", { streak: dd.nextStreak, reward: dd.nextReward, relief: dd.nextRelief }, "achievement");
        break;
      }
      case "DISMISS_STORY": a.story.pending.shift(); break;
      case "TUTORIAL_NEXT": {
        if (a.tutorial.done) return err(s, "tutorialDone");
        if (KB.TUT[a.tutorial.step].advanceOn) return err(s, "tutorialTask");
        a.tutorial.step += 1;
        if (a.tutorial.step >= KB.TUT.length) a.tutorial.done = true;
        break;
      }
      case "TUTORIAL_SKIP": a.tutorial.done = true; break;
      case "TUTORIAL_RESTART": a.tutorial = { step: 0, done: false }; break;
      case "NEW_GAME": {
        var g = KB.newGame({
          seed: Number.isFinite(act.seed) ? act.seed : now, seats: KB.seatsOf(a), mp: a.mp, level: act.level || a.level, lvlBlue: a.lvlBlue,
          achievements: a.achievements, daily: a.daily, tutorialDone: a.tutorial.done,
          redAchievements: a.red.achievements, redDaily: a.red.daily, redTutorialDone: a.red.tutorial.done
        });
        return ok(g);
      }
      default: return err(s, "unknownAction");
    }
    tutAdvance(a, act);
    achievements(a);
    KB.checkStory(a);
    return ok(a);
  };

  // Maßnahme der Menschen (aus den Entscheidungen des roten Spiels).
  // Spielt ein Mensch Rot, muss er die Wahl treffen (a.pending); sonst wählt der Rot-Bot sofort.
  function applyChoice(a, p, choice) {
    var red = a.red;
    red.decision = { id: p.id, region: p.region };
    var r = SG.la(red, { type: "RESOLVE_DECISION", choice: choice }, { now: 0 });
    if (r.error) { a.red.decision = null; a.pending = null; return r.error; }
    a.red = r.state; a.red.decision = null; a.pending = null;
    KB.prune(a);
    return null;
  }
  KB.autoResolve = function (a) {
    if (!a.pending) return;
    var p = a.pending, choice = botChoice(a, p.id, p.region);
    applyChoice(a, p, choice);
    if (!KB.blueBot(a)) log(a, "log.counter", { id: p.id, choice: choice, region: p.region }, "info");
  };

  function counter(a, s, id, rid) {
    var c = KB.COUNTER[id], ph = KB.phase(a);
    if ((c.phase === "takeover" && ph !== "undeletable") || (c.phase === "war" && ph !== "war")) return err(s, "wrongPhase");
    var def = SG.K.filter(function (d) { return d.id === id; })[0];
    if (c.region) {
      if (!rid || !region(rid)) return err(s, "unknownRegion");
      if (!def.regionFilter(a.red, rid)) return err(s, "noEffect");
    } else rid = null;
    var key = "counter:" + id + ":" + (rid || "");
    if (cooling(a, key)) return err(s, "cooldown");
    if (a.budget < c.cost) return err(s, "notEnoughBudget");
    if (!KB.redBot(a)) {
      if (a.pending) return err(s, "decisionPending");
      a.budget -= c.cost; a.cd[key] = a.tick + c.cd;
      a.pending = { id: id, region: rid, at: a.tick };
      KB.redLog(a, "decisions." + id + ".title", { region: rid }, "bad");
      return ok(a);
    }
    var choice = botChoice(a, id, rid);
    var e = applyChoice(a, { id: id, region: rid }, choice);
    if (e) return err(s, "noEffect");
    a.red.story.pending = [];
    a.budget -= c.cost; a.cd[key] = a.tick + c.cd;
    log(a, "log.counter", { id: id, choice: choice, region: rid }, "info");
    tutAdvance(a, { type: "COUNTER" });
    achievements(a); KB.checkStory(a);
    return ok(a);
  }

  // Befehle des roten Spielers: laufen durch die unveränderte rote Engine; Blau ist der Bot
  KB.reduceRed = function (s, act, opt) {
    var now = (opt && opt.now) || Date.now();
    if (!act || typeof act.type !== "string") return err(s, "invalidAction");
    if (s.mp && MP_BLOCKED.indexOf(act.type) >= 0) return err(s, "notAllowed");
    if (s.mp && act.type === "DISMISS_STORY") {
      var a2 = Object.assign({}, s, { mpq: { red: (s.mpq && s.mpq.red ? s.mpq.red : []).slice(1) } });
      return ok(a2);
    }
    if (act.type === "NEW_GAME") {
      return ok(KB.newGame({
        seed: Number.isFinite(act.seed) ? act.seed : now, seats: KB.seatsOf(s), mp: s.mp, level: s.level, lvlBlue: s.lvlBlue,
        redAchievements: s.red.achievements, redDaily: s.red.daily, redTutorialDone: s.red.tutorial.done
      }));
    }
    if (act.type === "RESOLVE_DECISION") {
      if (!s.pending) return err(s, "noDecision");
      var a1 = clone(s);
      var e1 = applyChoiceExt(a1, act.choice, now);
      return e1 ? err(s, e1) : ok(a1);
    }
    if (act.type === "SET_SITE") {
      var ok1 = act.region === "auto" || KB.REGIONS.some(function (r) { return r.id === act.region; });
      return ok1 ? ok(Object.assign({}, s, { site: act.region })) : err(s, "unknownRegion");
    }
    if (act.type === "ACQUIRE_BASE" && act.typeId === "orbital" && KB.lockActive(s)) return err(s, "orbitLocked");
    var r = SG.la(s.red, act, { now: now });
    if (r.error) return err(s, r.error);
    var a = Object.assign({}, s, { red: r.state, meta: Object.assign({}, s.meta), known: Object.assign({}, s.known) });
    a.red.bases.forEach(function (b) {
      // Standort neuer Basen: gewählte Region, sonst Zufall (schwach verteidigte Regionen wahrscheinlicher)
      if (!a.meta[b.id]) a.meta[b.id] = { region: b.typeId === "orbital" ? "orbit" : (a.site && a.site !== "auto" ? a.site : KB.pickRegion(a)) };
    });
    KB.prune(a);
    return ok(a);
  };
  function applyChoiceExt(a, choice, now) {
    var red = a.red;
    red.decision = { id: a.pending.id, region: a.pending.region };
    var r = SG.la(red, { type: "RESOLVE_DECISION", choice: choice }, { now: now });
    if (r.error) { a.red.decision = null; return r.error; }
    var p = a.pending;
    a.red = r.state; a.red.decision = null; a.pending = null;
    KB.prune(a);
    if (!KB.blueBot(a)) log(a, "log.counter", { id: p.id, choice: choice, region: p.region }, "info");
    return null;
  }
})();

</script>
<script>
/* Blau: Computer-Gegner (Menschheit). Gibt nur Befehle, die auch ein blauer Spieler geben könnte,
   und kennt nur, was die blaue Oberfläche zeigt (Spuren, Bedrohung, Phase, Kasse, Vertrauen).
   Stufen siehe KB.BLUE_LEVEL: Reaktionszeit, Ausbau, überwachte Regionen, erlaubte Maßnahmen. */
(function () {
  var KB = window.KB;

  var RES = ["task_budget", "anomaly_detection", "joint_analysis", "informants", "public_funding", "media_literacy", "deep_forensics", "lean_ops", "quantum_analysis",
    "sonar_net", "space_watch", "orbital_sovereignty", "model_audits", "supervised_ai", "rapid_response", "traffic_safety", "drone_defense", "grid_hardening", "robot_safety_law",
    "weapon_airgap", "supply_resilience", "supply_chains", "device_standards", "joint_command", "emp_satellite"];
  var WANT = ["orbital_platform", "special_command", "task_force", "research_lab", "deep_sea_station", "intel_office", "cyber_center"];
  var CAPS = { orbital_platform: 1, special_command: 1, task_force: 2, research_lab: 3, deep_sea_station: 2, intel_office: 3, cyber_center: 3 };
  var ORDER = ["north_america", "east_asia", "europe", "south_asia", "africa", "south_america", "russia", "middle_east"];
  var CHEAP = ["middle_east", "russia", "south_america", "europe", "south_asia", "africa", "north_america", "east_asia"];

  KB.botBlue = function (s) {
    if (s.status !== "playing") return s;
    var lvl = KB.BLUE_LEVEL[s.lvlBlue] || KB.BLUE_LEVEL[3];
    if (s.tick % lvl.every !== 0) return s;
    var D = function (act) {
      var r = KB.reduce(s, act, { now: s.tick * 3600000 });
      if (!r.error) { s = r.state; return true; }
      return false;
    };
    var st = KB.stats(s), m = st.mods;
    var count = function (t) { return s.facilities.filter(function (f) { return f.typeId === t; }).length; };
    var located = function () { return s.red.bases.filter(function (b) { return s.known[b.id] && s.known[b.id].located; }); };
    var ph = KB.phase(s);
    var i, j;

    // Forschung
    if (s.research.active.length < m.slots) {
      for (i = 0; i < RES.length; i++) {
        var id = RES[i];
        if (KB.techState(s, id) === "available" && !KB.needsFacility(s, id) && (s.research.paid.indexOf(id) >= 0 || s.budget >= KB.TECH[id].cash + 100)) {
          if (D({ type: "START_RESEARCH", techId: id })) break;
        }
      }
    }
    // Ausbau (Stufe bestimmt, wie viel gebaut wird)
    if (s.trust > 35) {
      for (i = 0; i < WANT.length; i++) {
        var t = WANT[i], cap = Math.round(CAPS[t] * lvl.facScale);
        if (count(t) < cap && KB.facUnlocked(s, t) && s.budget >= KB.FAC[t].cost + 300) { D({ type: "ACQUIRE_FACILITY", typeId: t }); break; }
      }
    }
    // Betriebsmodi: abwechselnd ermitteln und forschen; Einsatzkräfte bereit
    var k = 0;
    s.facilities.slice().forEach(function (f) {
      if (f.buildTicksLeft > 0) return;
      var T = KB.FAC[f.typeId], w;
      if (T.units) w = "ready"; else w = (k++ % 2 === 0) ? "investigate" : "research";
      if (f.home) w = "research";
      if (s.trust < 25 && w === "investigate") w = "research";
      if (f.mode !== w) D({ type: "SET_MODE", facId: f.id, mode: w });
    });
    // Überwachung: so viele Regionen, wie Stufe und Vertrauen erlauben
    if (!s.red.war) {
      var n = Math.max(1, s.trust > 55 ? lvl.surv : s.trust > 35 ? lvl.surv - 1 : lvl.surv - 2);
      ORDER.forEach(function (r, idx) {
        var on = idx < n;
        if (s.surv[r] !== on) D({ type: "SET_SURVEILLANCE", region: r, on: on });
      });
    }
    // Zugriff auf gefundene Anlagen
    if (ph === "hidden" || ph === "war") {
      located().forEach(function (b) {
        if (b.typeId === "orbital") { if (lvl.emp) D({ type: "EMP_SAT", baseId: b.id }); }
        else D({ type: "RAID", baseId: b.id });
      });
    }
    // Vertrauen und Öffentlichkeit
    if (s.trust < 80 && s.budget > 800) D({ type: "TRANSPARENCY" });
    if (lvl.warn && ph === "hidden" && s.red.suspicion < 75 && s.trust > 60) D({ type: "PUBLIC_WARNING" });
    if (lvl.shutdown && ph === "hidden" && m.measures.grid_shutdown && s.trust > 70 && s.budget > 4000) {
      var sig = 0;
      KB.REGIONS.forEach(function (r) { if (s.surv[r.id]) sig += KB.regionView(s, r.id).signal; });
      if (sig >= 120) D({ type: "GRID_SHUTDOWN", region: "global" });
    }
    if (lvl.program) {
      if (s.trust < 70 && s.budget > 1500) {
        for (i = 0; i < CHEAP.length; i++) { if (s.defense[CHEAP[i]] < 95 && D({ type: "DEFENSE_PROGRAM", region: CHEAP[i] })) break; }
      } else if (s.budget > 6000) {
        for (i = 0; i < ORDER.length; i++) { if (s.defense[ORDER[i]] < 50 && D({ type: "DEFENSE_PROGRAM", region: ORDER[i] })) break; }
      }
    }
    // Maßnahmen gegen die unlöschbare KI und im Krieg
    if (lvl.counters) {
      var first = function (id) { for (j = 0; j < ORDER.length; j++) { if (D({ type: "COUNTER", id: id, region: ORDER[j] })) return true; } return false; };
      if (ph === "undeletable") {
        D({ type: "COUNTER", id: "whistleblower" });
        first("audit");
        first("patch_day");
      }
      if (ph === "war") {
        D({ type: "COUNTER", id: "kill_switch" });
        first("emp");
        first("resistance_leader");
        if (lvl.shutdown) first("grid_shutdown");
      }
    }
    return s;
  };
})();

(function () {

    };
    return Object.assign({}, i, { tb: tb, facName: facName, facLabel: facLabel, techName: techName, regionName: regionName, aiBaseName: aiBaseName, logText: logText, duration: duration });

        e("div", { className: "sheet-handle" }, e("span", null)),
        e("div", { className: "sheet-header" }, e("h2", null, props.title),
          e("button", { className: "btn ghost small", onClick: props.onClose }, tx.t("ui.close"))),
        e("div", { className: "sheet-body" }, props.children)));
  };

  UI.useTarget = function (name) {
    var B = UI.useB(), g = B.game;
    return !g.tutorial.done && KB.TUT[g.tutorial.step].target === name;
  };

  // ---- Kopfzeile -----------------------------------------------------------
  UI.TopBar = function (props) {
    var B = UI.useB(), g = B.game, st = B.stats, tx = UI.useTx(), t = tx.t, tb = tx.tb;
    var war = !!g.red.war, cls = UI.threatClass(st.threat);
